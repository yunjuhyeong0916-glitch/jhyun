<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-label="LPDDR Combo TX 동작 모델의 병렬 입력, 직렬화, 위상 정렬과 pre-emphasis 경로">
