<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">DP-SMM 검증 사례: 두 번째 제안 경로가 실제 이력 재평가 후 선택되는 과정</title><desc id="desc">동일한 시작 상태와 종료 상태, 유입 PM 0의 기존 검증 벡터이다. 경로 A의 제안 비용은 21, 실제 이력 반영 비용은 31이다. 경로 B의 제안 비용은 22, 실제 이력 반영 비용은 27이다. 제안 순위 2위인 경로 B가 재평가 후 선택된다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#657587"/></marker></defs>
<style>text{font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#172b43}.small{fill:#526479}</style>
<rect width="1200" height="520" fill="#fff"/>
<text x="32" y="48" font-size="30" font-weight="700" text-anchor="start">두 번째 후보를 남겨야 하는 이유</text>
<text x="32" y="84" font-size="19" font-weight="400" text-anchor="start" style="fill:#526479">DP-SMM의 기존 검증 벡터  ·  같은 시작·종료 상태  ·  유입 PM = 0</text>
<text x="220" y="144" font-size="21" font-weight="700" text-anchor="middle">① 제안 비용으로 후보 보존</text>
<text x="610" y="144" font-size="21" font-weight="700" text-anchor="middle">② 실제 심볼 이력으로 재평가</text>
<text x="1015" y="144" font-size="21" font-weight="700" text-anchor="middle">③ 최종 경로 선택</text>
<rect x="32" y="180" width="350" height="88" rx="12" fill="#fff3f1" stroke="#c24137" stroke-width="2"/>
<text x="192" y="213" font-size="21" font-weight="700" text-anchor="middle">경로 A · 제안 1위</text>
<text x="332" y="238" font-size="35" font-weight="700" text-anchor="middle" style="fill:#c24137">21</text>
<path d="M383 224L438 224" fill="none" stroke="#657587" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="446" y="180" width="330" height="88" rx="12" fill="#fff3f1" stroke="#c24137" stroke-width="2"/>
<text x="561" y="231" font-size="21" font-weight="400" text-anchor="middle">이력 반영 비용</text>
<text x="725" y="238" font-size="35" font-weight="700" text-anchor="middle" style="fill:#c24137">31</text>
<rect x="32" y="292" width="350" height="88" rx="12" fill="#edf5ff" stroke="#2563bf" stroke-width="2"/>
<text x="192" y="325" font-size="21" font-weight="700" text-anchor="middle">경로 B · 제안 2위</text>
<text x="332" y="350" font-size="35" font-weight="700" text-anchor="middle" style="fill:#2563bf">22</text>
<path d="M383 336L438 336" fill="none" stroke="#657587" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="446" y="292" width="330" height="88" rx="12" fill="#edf5ff" stroke="#2563bf" stroke-width="2"/>
<text x="561" y="343" font-size="21" font-weight="400" text-anchor="middle">이력 반영 비용</text>
<text x="725" y="350" font-size="35" font-weight="700" text-anchor="middle" style="fill:#2563bf">27</text>
<rect x="852" y="212" width="316" height="150" rx="18" fill="#edf5ff" stroke="#2563bf" stroke-width="2"/>
<text x="1010" y="257" font-size="28" font-weight="700" text-anchor="middle" style="fill:#2563bf">경로 B 선택</text>
<text x="1010" y="299" font-size="33" font-weight="700" text-anchor="middle">27 &lt; 31</text>
<text x="1010" y="335" font-size="20" font-weight="400" text-anchor="middle">해당 경로의 심볼 복원</text>
<path d="M778 336L845 294" fill="none" stroke="#2563bf" stroke-width="3" marker-end="url(#arrow)"/>
<text x="600" y="440" font-size="23" font-weight="700" text-anchor="middle">제안 단계의 2위 경로도, 실제 이력을 반영하면 최종 선택될 수 있습니다.</text>
<text x="600" y="479" font-size="20" font-weight="400" text-anchor="middle" style="fill:#526479">두 경로를 합성 단계에 남겨 최종 비용으로 다시 판단할 기회를 보존합니다.</text>
</svg>