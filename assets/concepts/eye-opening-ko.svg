<svg xmlns="http://www.w3.org/2000/svg" width="440" height="478" viewBox="0 0 440 478" role="img" aria-labelledby="title"><title id="title">Eye opening의 전압·시간 여유</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker><marker id="back" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10 0L0 5L10 10Z" fill="context-stroke"/></marker></defs><rect width="440" height="478" rx="18" fill="#f6f8fa"/><g font-family="'Malgun Gothic','Noto Sans KR','Segoe UI',sans-serif"><text x="220" y="36" font-size="21" fill="#1f2328" font-weight="700" text-anchor="middle">Eye의 높이와 폭 읽기</text><rect x="20" y="56" width="400" height="292" rx="12" fill="white" stroke="#d1d9e0"/><line x1="40" y1="312" x2="402" y2="312" stroke="#8c959f" stroke-width="1"/><line x1="40" y1="83" x2="40" y2="312" stroke="#8c959f" stroke-width="1"/><text x="48" y="85" font-size="16" fill="#59636e" font-weight="400" text-anchor="start">전압</text><text x="395" y="335" font-size="16" fill="#59636e" font-weight="400" text-anchor="end">시간 →</text><path d="M45 196 C92 119 118 119 220 119 S344 119 397 196" fill="none" stroke="#0969da" stroke-opacity=".5" stroke-width="2"/><path d="M45 196 C92 273 118 273 220 273 S344 273 397 196" fill="none" stroke="#0969da" stroke-opacity=".5" stroke-width="2"/><path d="M45 202 C92 125 118 125 220 125 S344 125 397 202" fill="none" stroke="#0969da" stroke-opacity=".5" stroke-width="2"/><path d="M45 202 C92 279 118 279 220 279 S344 279 397 202" fill="none" stroke="#0969da" stroke-opacity=".5" stroke-width="2"/><path d="M45 208 C92 131 118 131 220 131 S344 131 397 208" fill="none" stroke="#0969da" stroke-opacity=".5" stroke-width="2"/><path d="M45 208 C92 285 118 285 220 285 S344 285 397 208" fill="none" stroke="#0969da" stroke-opacity=".5" stroke-width="2"/><path d="M220 143 L220 260" fill="none" stroke="#bc4c00" stroke-width="2"