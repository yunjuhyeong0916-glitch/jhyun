<svg xmlns="http://www.w3.org/2000/svg" width="440" height="544" viewBox="0 0 440 544" role="img" aria-labelledby="title"><title id="title">From model to hardware</title><rect width="440" height="544" rx="18" fill="#f6f8fa"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#59636e"/></marker></defs><text x="220" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#1f2328">From model to hardware</text><rect x="24" y="62" width="392" height="86" rx="12" fill="#fff" stroke="#0969da" stroke-width="2"/><text x="220" y="96" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#1f2328">Model</text><text x="220" y="124" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#59636e">Define signal-processing behavior</text><path d="M220 152V173" stroke="#59636e" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="178" width="392" height="86" rx="12" fill="#fff" stroke="#0969da" stroke-width="2"/><text x="220" y="212" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#1f2328">RTL + testbench</text><text x="220" y="240" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#59636e">Describe and check the circuit</text><path d="M220 268V289" stroke="#59636e" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="294" width="392" height="86" rx="12" fill="#fff" stroke="#0969da" stroke-width="2"/><text x="220" y="328" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#1f2328">FPGA implementation</text><text x="220" y="356" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#59636e">Map logic and check timing</text><path d="M220 384V405" stroke="#59636e" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="410" width="392" height="86" rx="12" fill="#fff" stroke="#0969da" stroke-width="2"/><text x="220" y="444" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#1f2328">Board evaluation</text><text x="220" y="472" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#59636e">Observe physical signal behavior</text></svg>
