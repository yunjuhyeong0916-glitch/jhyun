<title id="title">Where AI was used and how results were checked</title><desc id="desc">MATLAB MCP connects Codex to MATLAB for model execution and result inspection. AI assisted with RTL and testbench coding, checked against FFE outputs, detector decisions and output timing. It also assisted with control, execution and analysis code for ZCU208 coefficient updates, capture collection, PL PRBS checker results and Python BER analysis.</desc>
