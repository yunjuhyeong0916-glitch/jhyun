<title id="title">ZCU208 측정 harness 연결 구조</title><desc id="desc">PowerShell coordinates condition selection, Vitis application builds, XSCT launch and UART collection. ZCU208 PS applies coefficients and reads capture BRAM; PL performs receiver DSP and PRBS checking. UART stores sample captures. ILA CSV exports PRBS counters for Python BER analysis.</desc>
